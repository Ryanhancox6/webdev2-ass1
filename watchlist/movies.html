<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- lets the page show special characters like ★ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- makes the page fit phone screens -->
  <title>Ryan's Watchlist | My Watchlist</title> <!-- text shown on the browser tab -->
  <link rel="stylesheet" href="css/style.css"> <!-- the shared stylesheet -->
</head>
<body>

  <!-- HEADER: same as the other pages, but "My Watchlist" has class="active" -->
  <header>
    <div class="logo">Ryan's <span>Watchlist</span></div>
    <nav>
      <ul>
        <li><a href="index.html">Welcome</a></li>
        <li><a href="movies.html" class="active">My Watchlist</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- SEARCH FORM: searchMovies() in movies.js reads these when the form is submitted -->
    <section>
      <h2>Search</h2>
      <form id="searchForm">
        <div class="field">
          <label for="searchText">Title</label>
          <input type="text" id="searchText" placeholder="e.g. dark"> <!-- results update as you type (keyup event) -->
        </div>
        <div class="field">
          <label for="searchStatus">Show</label>
          <select id="searchStatus">
            <option value="All">Watched and unwatched</option>
            <option value="watched">Watched only</option>
            <option value="unwatched">Unwatched only</option>
          </select>
        </div>
        <button type="submit">Search</button>                               <!-- submits the form -->
        <button type="button" id="showAllBtn" class="grey">Show all</button> <!-- type="button" so it doesn't submit -->
      </form>
      <p class="grey-text" id="searchMessage"></p> <!-- "Titles found: 3" -->
    </section>

    <!-- THE ARRAY OF OBJECTS: displayMovies() in movies.js puts a card for each object in here -->
    <section>
      <h2>Films and series</h2>
      <p class="grey-text" id="summary"></p> <!-- movies.js: "Watched 12 of 15 (80%)" -->
      <div class="cards" id="movieCards"></div>
    </section>

    <!-- DELETE FORM: movies.js fills the drop-down with every title, deleteMovie() removes the chosen one -->
    <section>
      <h2>Delete a title</h2>
      <form id="deleteForm">
        <div class="field">
          <label for="deleteChoice">Choose a film or series</label>
          <select id="deleteChoice"></select> <!-- the <option>s are added by fillDeleteList() -->
        </div>
        <button type="submit">Delete</button>
      </form>
      <p class="success" id="deleteMessage"></p> <!-- e.g. "Joker was deleted." -->
    </section>

    <!-- ADD FORM: addMovie() in movies.js checks these values and adds a new object -->
    <section>
      <h2>Add to the watchlist</h2>
      <form id="addForm">
        <!-- text box -->
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g. the godfather">
        </div>

        <!-- radio buttons: only one of the two can be picked, because they share name="type" -->
        <div class="field">
          <span class="label-text">Type</span>
          <div class="choices">
            <label><input type="radio" name="type" value="Film" checked> Film</label>
            <label><input type="radio" name="type" value="Series"> Series</label>
          </div>
        </div>

        <!-- checkbox: ticked = watched. movies.js listens for its "change" event -->
        <div class="field">
          <span class="label-text">Watched?</span>
          <label><input type="checkbox" id="watched" checked> I've watched it</label>
        </div>

        <!-- rating and review are only shown while the checkbox is ticked -->
        <div class="watched-fields" id="watchedFields">
          <!-- drop-down list (select) -->
          <div class="field">
            <label for="rating">Rating</label>
            <select id="rating">
              <option value="5">★★★★★ (5)</option>
              <option value="4">★★★★☆ (4)</option>
              <option value="3">★★★☆☆ (3)</option>
              <option value="2">★★☆☆☆ (2)</option>
              <option value="1">★☆☆☆☆ (1)</option>
            </select>
          </div>

          <!-- textarea: a bigger box for longer text -->
          <div class="field review-field">
            <label for="review">Short review</label>
            <textarea id="review" rows="2" placeholder="What did you think?"></textarea>
          </div>
        </div>

        <button type="submit">Add</button>
      </form>
      <p class="error" id="addError"></p>     <!-- validation messages -->
      <p class="success" id="addMessage"></p> <!-- e.g. "The godfather was added." -->
    </section>

  </main>

  <!-- FOOTER: common.js fills in the year and date -->
  <footer>
    <p>&copy; <span id="footerYear"></span> Ryan Hancox - Website Development 2</p>
    <p id="footerDate"></p>
  </footer>

  <!-- data.js first (the movies array), then common.js, then this page's own code -->
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/movies.js"></script>
</body>
</html>
